# Spot prices: realized past + live Nordpool forecast
# (`sensor.nordpool_spot` attribute `raw`).
#
# Helper YAML: `homeassistant/nordpool_spot.yaml` (trigger-based template,
# include as a package). Only reads `sensor.nordpool`.
#
# Paste this card into a Lovelace dashboard (raw editor). Needs
# [statistics-graph-chart-card](https://github.com/cataseven/Statistics-Graph-Chart-Card).
# Replace charger serials 111111 / 222222 (delete charger 2 if you only have one).
#
# Week view: set `hours_to_show: 168` and drop `graph_start` / `graph_end_hour`
# so the card still extends through the forecast while showing the past week.

type: custom:statistics-graph-chart-card
card_header: Spot
graph_start: day
hours_to_show: 48
show_full_period: true
graph_end_hour: now+48
show_now_line: true
state_strip_height: 10
state_strip_labels: false
entities:
  - entity: sensor.nordpool_spot
    name: Spot
    graph_type: bar
    data_attribute: raw
    data_time_field: start
    data_value_field: value
    decimals: 3
  - entity: binary_sensor.kotiakku_goe_direct_111111_full_power
    name: Charger 1
    graph_type: state_strip
    state_map:
      - value: "off"
        color: rgba(0, 0, 0, 0)
      - value: "on"
        label: "1"
        color: "#17becf"
  - entity: binary_sensor.kotiakku_goe_direct_222222_full_power
    name: Charger 2
    graph_type: state_strip
    state_map:
      - value: "off"
        color: rgba(0, 0, 0, 0)
      - value: "on"
        label: "2"
        color: "#ff7f0e"
  - entity: binary_sensor.kotiakku_goe_direct_window_active
    name: Window
    graph_type: state_strip
    state_map:
      - value: "off"
        color: rgba(0, 0, 0, 0)
      - value: "on"
        label: Window
        color: "#2ca02c"
annotations:
  - type: span
    start: "{{ state_attr('sensor.kotiakku_goe_direct_window', 'window_1_start') }}"
    end: "{{ state_attr('sensor.kotiakku_goe_direct_window', 'window_1_end') }}"
    color: "#2ca02c"
    opacity: 0.18
    label: Window
  - type: span
    start: "{{ state_attr('sensor.kotiakku_goe_direct_window', 'window_2_start') }}"
    end: "{{ state_attr('sensor.kotiakku_goe_direct_window', 'window_2_end') }}"
    color: "#2ca02c"
    opacity: 0.18
    label: Window

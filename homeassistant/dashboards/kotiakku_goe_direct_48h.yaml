# Single dashboard tab: 48 h spot + planned charge windows.
#
# Needs HACS [apexcharts-card](https://github.com/RomRider/apexcharts-card).
# No template sensors, packages, or other helpers. Window bands and
# tomorrow's Nordpool curve come from entity attributes / data_generator.
#
# Paste this file as a YAML dashboard, or paste the `views:` list into a
# UI dashboard's raw editor.
#
# Edit only the leftover chart inputs (solar / house / Controller mean)
# and charger serials 111111 / 222222. Spot uses
# `text.kotiakku_goe_direct_electricity_price_sensor` from the integration.
#
# configuration.yaml (optional YAML dashboard):
#   lovelace:
#     dashboards:
#       kotiakku-goe-direct-48h:
#         mode: yaml
#         title: Kotiakku go-e Direct 48h
#         filename: dashboards/kotiakku_goe_direct_48h.yaml

title: Kotiakku go-e Direct 48h
views:
  - title: 48h
    path: kotiakku-goe-direct-48h
    type: panel
    icon: mdi:ev-station
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              {% set price = states('text.kotiakku_goe_direct_electricity_price_sensor') | trim %}
              {% set solar = states('sensor.solar_power') %}
              {% set house = states('sensor.house_power') %}
              {% set ev_s = states('sensor.go_econtroller_ev_power_5_min_mean') %}
              {% set solar_kw = solar | float(0) | abs %}
              {% set house_kw = house | float(0) | abs %}
              {% set ev_kw = (ev_s | float(0) | abs / 1000) if ev_s | is_number else 0 %}
              {% set leftover = (solar_kw - house_kw + ev_kw) if (solar | is_number and house | is_number) else none %}
              **48 h from local midnight** · green = SolarPriority window · orange = off-sun · red = price ceiling.

              Spot **{{ states(price) if price else '—' }}** {{ state_attr(price, 'unit_of_measurement') or '' }}
              · leftover **{{ leftover | round(2) if leftover is not none else '—' }} kW**
              (`|solar| − |house| + |ev|`)
              · window {{ states('sensor.kotiakku_goe_direct_window') }} → {{ state_attr('sensor.kotiakku_goe_direct_window', 'end') }}.

              Delete charger 2 cards/series if you only have one charger. Leftover
              chart sources: `sensor.solar_power`, `sensor.house_power`,
              `sensor.go_econtroller_ev_power_5_min_mean` (kW / kW / W).

          - type: glance
            show_name: true
            show_state: true
            columns: 6
            entities:
              - entity: binary_sensor.kotiakku_goe_direct_window_active
                name: Window
              - entity: binary_sensor.kotiakku_goe_direct_solar_enough
                name: Enough solar
              - entity: select.kotiakku_goe_direct_policy_111111
                name: Charger 1
              - entity: binary_sensor.kotiakku_goe_direct_111111_full_power
                name: 1 full power
              - entity: select.kotiakku_goe_direct_policy_222222
                name: Charger 2

          - type: glance
            show_name: true
            show_state: true
            columns: 5
            entities:
              - entity: sensor.kotiakku_goe_direct_solar_today_kwh
                name: Solar today
              - entity: sensor.kotiakku_goe_direct_solar_tomorrow_kwh
                name: Solar tomorrow
              - entity: sensor.kotiakku_goe_direct_solar_gating_kwh
                name: Solar gating
              - entity: sensor.kotiakku_goe_direct_solar_gating_day
                name: Gating day
              - entity: sensor.kotiakku_goe_direct_solar_kwh
                name: Forecast solar

          - type: custom:apexcharts-card
            header:
              show: true
              title: Spot · SolarPriority window · off-sun
              show_states: false
            graph_span: 2d
            span:
              start: day
            now:
              show: true
              label: now
            update_interval: 1min
            apex_config:
              legend:
                show: true
              grid:
                borderColor: "#4444"
            yaxis:
              - id: price
                decimals: 3
                apex_config:
                  title:
                    text: €/kWh
            series:
              - entity: sensor.kotiakku_goe_direct_window
                name: Window
                yaxis_id: price
                type: area
                curve: stepline
                color: "#2ca02c"
                opacity: 0.32
                stroke_width: 0
                extend_to: false
                unit: €/kWh
                show:
                  in_header: false
                  legend_value: false
                data_generator: &window_band |
                  function parseTs(v) {
                    if (v == null || v === '') return NaN;
                    if (typeof v === 'number' && Number.isFinite(v))
                      return v < 1e12 ? v * 1000 : v;
                    return Date.parse(v);
                  }
                  function windowsFrom(attrs) {
                    const out = [];
                    const list = attrs && attrs.windows;
                    if (Array.isArray(list)) {
                      for (const w of list) {
                        if (!w) continue;
                        const s = parseTs(w.start);
                        const e = parseTs(w.end);
                        if (Number.isFinite(s) && Number.isFinite(e)) out.push([s, e]);
                      }
                    }
                    if (!out.length && attrs) {
                      for (let i = 1; i <= 16; i++) {
                        const s = parseTs(attrs['window_' + i + '_start']);
                        const e = parseTs(attrs['window_' + i + '_end']);
                        if (Number.isFinite(s) && Number.isFinite(e)) out.push([s, e]);
                      }
                    }
                    return out;
                  }
                  function priceSlots() {
                    const raw = String(((hass.states['text.kotiakku_goe_direct_electricity_price_sensor'] || {}).state) || '').trim();
                    const id = raw || 'sensor.nordpool_kwh_fi';
                    const a = ((hass.states[id] || {}).attributes) || {};
                    return [].concat(a.raw_today || a.today || [], a.raw_tomorrow || a.tomorrow || []);
                  }
                  function slotVal(entry) {
                    const v = entry.value != null ? entry.value : entry.price;
                    const n = Number(v);
                    return Number.isFinite(n) ? n : 0;
                  }
                  const windows = windowsFrom(entity.attributes || {});
                  const pts = [];
                  for (const entry of priceSlots()) {
                    const t = parseTs(entry.start);
                    if (!Number.isFinite(t)) continue;
                    let on = false;
                    for (const w of windows) {
                      if (t >= w[0] && t < w[1]) { on = true; break; }
                    }
                    pts.push([t, on ? slotVal(entry) : 0]);
                  }
                  return pts;
              - entity: sensor.kotiakku_goe_direct_window
                name: Off-sun
                yaxis_id: price
                type: area
                curve: stepline
                color: "#ff7f0e"
                opacity: 0.22
                stroke_width: 0
                extend_to: false
                unit: €/kWh
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  function parseTs(v) {
                    if (v == null || v === '') return NaN;
                    if (typeof v === 'number' && Number.isFinite(v))
                      return v < 1e12 ? v * 1000 : v;
                    return Date.parse(v);
                  }
                  function rangesFrom(list) {
                    const out = [];
                    if (!Array.isArray(list)) return out;
                    for (const w of list) {
                      if (!w) continue;
                      const s = parseTs(w.start);
                      const e = parseTs(w.end);
                      if (Number.isFinite(s) && Number.isFinite(e)) out.push([s, e]);
                    }
                    return out;
                  }
                  function priceSlots() {
                    const raw = String(((hass.states['text.kotiakku_goe_direct_electricity_price_sensor'] || {}).state) || '').trim();
                    const id = raw || 'sensor.nordpool_kwh_fi';
                    const a = ((hass.states[id] || {}).attributes) || {};
                    return [].concat(a.raw_today || a.today || [], a.raw_tomorrow || a.tomorrow || []);
                  }
                  function slotVal(entry) {
                    const v = entry.value != null ? entry.value : entry.price;
                    const n = Number(v);
                    return Number.isFinite(n) ? n : 0;
                  }
                  const blocked = rangesFrom((entity.attributes || {}).blocked);
                  const pts = [];
                  for (const entry of priceSlots()) {
                    const t = parseTs(entry.start);
                    if (!Number.isFinite(t)) continue;
                    let on = false;
                    for (const w of blocked) {
                      if (t >= w[0] && t < w[1]) { on = true; break; }
                    }
                    pts.push([t, on ? slotVal(entry) : 0]);
                  }
                  return pts;
              - entity: text.kotiakku_goe_direct_electricity_price_sensor
                name: Spot
                yaxis_id: price
                type: line
                curve: stepline
                color: "#1f4e79"
                stroke_width: 2
                extend_to: false
                unit: €/kWh
                show:
                  in_header: false
                  extremas: true
                data_generator: |
                  function parseTs(v) {
                    if (v == null || v === '') return NaN;
                    if (typeof v === 'number' && Number.isFinite(v))
                      return v < 1e12 ? v * 1000 : v;
                    return Date.parse(v);
                  }
                  const raw = String((entity.state || '')).trim();
                  const id = raw || 'sensor.nordpool_kwh_fi';
                  const a = ((hass.states[id] || {}).attributes) || {};
                  const slots = [].concat(a.raw_today || a.today || [], a.raw_tomorrow || a.tomorrow || []);
                  const pts = [];
                  for (const entry of slots) {
                    const t = parseTs(entry.start);
                    if (!Number.isFinite(t)) continue;
                    const v = entry.value != null ? entry.value : entry.price;
                    const n = Number(v);
                    if (!Number.isFinite(n)) continue;
                    pts.push([t, n]);
                  }
                  return pts;
              - entity: number.kotiakku_goe_direct_electricity_price_ceiling
                name: Ceiling
                yaxis_id: price
                type: line
                curve: straight
                color: "#d62728"
                stroke_width: 1
                stroke_dash: 4
                extend_to: false
                unit: €/kWh
                show:
                  in_header: false
                data_generator: |
                  const n = Number(entity.state);
                  const v = Number.isFinite(n) ? n : 0.2;
                  return [[start.getTime(), v], [end.getTime(), v]];

          - type: custom:apexcharts-card
            header:
              show: true
              title: Leftover kW (past) · planned 22 kW (today + tomorrow)
              show_states: false
            graph_span: 2d
            span:
              start: day
            now:
              show: true
              label: now
            update_interval: 1min
            experimental:
              color_threshold: true
            yaxis:
              - id: kw
                decimals: 2
                apex_config:
                  title:
                    text: kW
            series:
              - entity: select.kotiakku_goe_direct_policy_111111
                name: Charger 1 22 kW
                yaxis_id: kw
                type: area
                curve: stepline
                color: "#2ca02c"
                opacity: 0.22
                stroke_width: 0
                extend_to: false
                unit: kW
                show:
                  in_header: false
                  legend_value: false
                data_generator: &full_power_kw |
                  function parseTs(v) {
                    if (v == null || v === '') return NaN;
                    if (typeof v === 'number' && Number.isFinite(v))
                      return v < 1e12 ? v * 1000 : v;
                    return Date.parse(v);
                  }
                  function windowsFrom(attrs) {
                    const out = [];
                    const list = attrs && attrs.windows;
                    if (Array.isArray(list)) {
                      for (const w of list) {
                        if (!w) continue;
                        const s = parseTs(w.start);
                        const e = parseTs(w.end);
                        if (Number.isFinite(s) && Number.isFinite(e)) out.push([s, e]);
                      }
                    }
                    if (!out.length && attrs) {
                      for (let i = 1; i <= 16; i++) {
                        const s = parseTs(attrs['window_' + i + '_start']);
                        const e = parseTs(attrs['window_' + i + '_end']);
                        if (Number.isFinite(s) && Number.isFinite(e)) out.push([s, e]);
                      }
                    }
                    return out;
                  }
                  function priceSlots() {
                    const raw = String(((hass.states['text.kotiakku_goe_direct_electricity_price_sensor'] || {}).state) || '').trim();
                    const id = raw || 'sensor.nordpool_kwh_fi';
                    const a = ((hass.states[id] || {}).attributes) || {};
                    return [].concat(a.raw_today || a.today || [], a.raw_tomorrow || a.tomorrow || []);
                  }
                  function inWin(windows, t) {
                    for (const w of windows) {
                      if (t >= w[0] && t < w[1]) return true;
                    }
                    return false;
                  }
                  function kwhOf(id) {
                    const n = Number(((hass.states[id] || {}).state));
                    return Number.isFinite(n) ? n : null;
                  }
                  function enoughAt(t) {
                    const thr = Number(((hass.states['number.kotiakku_goe_direct_solar_enough_kwh'] || {}).state));
                    if (!Number.isFinite(thr) || thr <= 0) return false;
                    const today = kwhOf('sensor.kotiakku_goe_direct_solar_today_kwh');
                    const tom = kwhOf('sensor.kotiakku_goe_direct_solar_tomorrow_kwh');
                    const daySt = hass.states['sensor.kotiakku_goe_direct_solar_gating_day'] || {};
                    const sunset = parseTs((daySt.attributes || {}).sunset);
                    let day = String(daySt.state || '');
                    if (Number.isFinite(sunset)) day = t < sunset ? 'today' : 'tomorrow';
                    const v = day === 'tomorrow' ? tom : today;
                    return v != null && v >= thr;
                  }
                  const serial = entity.entity_id.split('_').pop();
                  const policy = String(((hass.states['select.kotiakku_goe_direct_policy_' + serial] || {}).state) || '');
                  const solar = ['SolarPriority', 'Cheapest', 'Supercheap', 'Longest', 'Earliest'].indexOf(policy) >= 0;
                  const solarAndGrid = policy === 'SolarAndGrid';
                  const until = String(((hass.states['switch.kotiakku_goe_direct_until_unplug_' + serial] || {}).state) || '') === 'on';
                  const force = policy === 'Force on' || until;
                  const windows = windowsFrom(((hass.states['sensor.kotiakku_goe_direct_window'] || {}).attributes) || {});
                  const full = 32 * 230 * 3 / 1000;
                  const now = Date.now();
                  const pts = [];
                  for (const entry of priceSlots()) {
                    const t = parseTs(entry.start);
                    if (!Number.isFinite(t)) continue;
                    const slotEnd = parseTs(entry.end);
                    const live = !Number.isFinite(slotEnd) || slotEnd > now;
                    let on = 0;
                    if (!live) on = 0;
                    else if (force) on = full;
                    else if (solarAndGrid && inWin(windows, t)) on = full;
                    else if (solar && !enoughAt(t) && inWin(windows, t)) on = full;
                    pts.push([t, on]);
                  }
                  return pts;
              - entity: select.kotiakku_goe_direct_policy_222222
                name: Charger 2 22 kW
                yaxis_id: kw
                type: area
                curve: stepline
                color: "#17becf"
                opacity: 0.22
                stroke_width: 0
                extend_to: false
                unit: kW
                show:
                  in_header: false
                  legend_value: false
                data_generator: *full_power_kw
              - entity: sensor.kotiakku_goe_direct_solar_kwh
                name: Leftover
                yaxis_id: kw
                type: area
                curve: straight
                color: "#ff7f0e"
                stroke_width: 2
                opacity: 0.35
                extend_to: false
                unit: kW
                show:
                  in_header: false
                color_threshold:
                  - value: -100
                    color: "#8c564b"
                  - value: 0
                    color: "#ff7f0e"
                data_generator: |
                  const SOLAR = 'sensor.solar_power';
                  const HOUSE = 'sensor.house_power';
                  const EV = 'sensor.go_econtroller_ev_power_5_min_mean';
                  const SOLAR_HOUSE_IN_KW = true;
                  const EV_IN_KW = false;
                  function toKw(v, inKw) {
                    const n = Math.abs(Number(v));
                    if (!Number.isFinite(n)) return 0;
                    return inKw ? n : n / 1000;
                  }
                  function leftoverNow() {
                    const s = hass.states[SOLAR];
                    const h = hass.states[HOUSE];
                    if (!s || !h) return null;
                    if (!Number.isFinite(Number(s.state)) || !Number.isFinite(Number(h.state))) return null;
                    const evs = hass.states[EV];
                    const ev = evs && Number.isFinite(Number(evs.state)) ? toKw(evs.state, EV_IN_KW) : 0;
                    return toKw(s.state, SOLAR_HOUSE_IN_KW) - toKw(h.state, SOLAR_HOUSE_IN_KW) + ev;
                  }
                  async function load(period) {
                    const req = {
                      type: 'recorder/statistics_during_period',
                      start_time: start.toISOString(),
                      end_time: new Date(Math.min(Date.now(), end.getTime())).toISOString(),
                      statistic_ids: [SOLAR, HOUSE, EV],
                      period: period,
                    };
                    try {
                      return await hass.callWS(Object.assign({}, req, {types: ['mean']}));
                    } catch (e) {
                      try {
                        return await hass.callWS(req);
                      } catch (e2) {
                        return {};
                      }
                    }
                  }
                  let stats = await load('5minute');
                  let rows = (stats && stats[SOLAR]) || [];
                  if (!rows.length) {
                    stats = await load('hour');
                    rows = (stats && stats[SOLAR]) || [];
                  }
                  const house = {};
                  const ev = {};
                  for (const r of (stats && stats[HOUSE]) || []) house[r.start] = r.mean;
                  for (const r of (stats && stats[EV]) || []) ev[r.start] = r.mean;
                  const pts = rows.map((r) => {
                    const s = toKw(r.mean, SOLAR_HOUSE_IN_KW);
                    const h = toKw(house[r.start], SOLAR_HOUSE_IN_KW);
                    const e = toKw(ev[r.start], EV_IN_KW);
                    return [new Date(r.start).getTime(), s - h + e];
                  });
                  const nowL = leftoverNow();
                  if (nowL != null) pts.push([Date.now(), nowL]);
                  return pts;
              - entity: number.kotiakku_goe_direct_surplus_start_w
                name: Start
                yaxis_id: kw
                type: line
                color: "#c47d00"
                stroke_width: 1
                stroke_dash: 3
                extend_to: false
                unit: kW
                show:
                  in_header: false
                data_generator: |
                  const n = Number(entity.state);
                  const v = Number.isFinite(n) ? n / 1000 : 2;
                  return [[start.getTime(), v], [end.getTime(), v]];
              - entity: number.kotiakku_goe_direct_phase3_min_w
                name: 3-phase
                yaxis_id: kw
                type: line
                color: "#6a3d9a"
                stroke_width: 1
                stroke_dash: 3
                extend_to: false
                unit: kW
                show:
                  in_header: false
                data_generator: |
                  const n = Number(entity.state);
                  const v = Number.isFinite(n) ? n / 1000 : 4.14;
                  return [[start.getTime(), v], [end.getTime(), v]];

          - type: entities
            title: Policies + windows
            show_header_toggle: false
            entities:
              - entity: select.kotiakku_goe_direct_policy_111111
              - entity: switch.kotiakku_goe_direct_until_unplug_111111
              - entity: number.kotiakku_goe_direct_priority_111111
              - entity: select.kotiakku_goe_direct_policy_222222
              - entity: switch.kotiakku_goe_direct_until_unplug_222222
              - entity: number.kotiakku_goe_direct_priority_222222
              - entity: sensor.kotiakku_goe_direct_window
              - entity: binary_sensor.kotiakku_goe_direct_solar_enough
              - entity: sensor.kotiakku_goe_direct_solar_today_kwh
              - entity: sensor.kotiakku_goe_direct_solar_tomorrow_kwh
              - entity: sensor.kotiakku_goe_direct_solar_gating_kwh
              - entity: sensor.kotiakku_goe_direct_solar_gating_day
              - entity: sensor.kotiakku_goe_direct_solar_kwh
              - entity: number.kotiakku_goe_direct_window_min_h
              - entity: number.kotiakku_goe_direct_window_max_h
              - entity: number.kotiakku_goe_direct_window_flex_pct
              - entity: number.kotiakku_goe_direct_window_flex_eur
              - entity: number.kotiakku_goe_direct_electricity_price_ceiling
              - entity: number.kotiakku_goe_direct_solar_enough_kwh
              - entity: number.kotiakku_goe_direct_offsun_hour_kwh
              - entity: text.kotiakku_goe_direct_electricity_price_sensor

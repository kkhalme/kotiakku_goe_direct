# Generic Nordpool spot helper. Include as a package, or paste under `template:`:
#   homeassistant:
#     packages:
#       nordpool_spot: !include nordpool_spot.yaml
#
# Only input: sensor.nordpool. Chart sensor.nordpool_spot with data_attribute: raw.

template:
  - sensor:
      - name: Nordpool spot
        unique_id: nordpool_spot
        icon: mdi:chart-bar
        state: "{{ states('sensor.nordpool') }}"
        unit_of_measurement: "{{ state_attr('sensor.nordpool', 'unit_of_measurement') }}"
        attributes:
          raw: "{{ (state_attr('sensor.nordpool', 'raw_today') or []) + (state_attr('sensor.nordpool', 'raw_tomorrow') or []) }}"

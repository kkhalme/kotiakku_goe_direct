# Template sensors for the 48 h leftover / cheapest-window graph.
#
# Same series as the Finnish year-round plots: spot, cheapest window,
# leftover kW, per-charger phase / amp / charge watts.
#
# Copy to <config>/packages/kotiakku_goe_direct_graph.yaml
# configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Placeholders — edit before use:
# - leftover inputs: sensor.solar_power, sensor.house_power,
#   sensor.go_econtroller_ev_power_5_min_mean
# - charger MQTT serials: 111111 and 222222 (fake examples)
# Kotiakku solar/house are kW; Controller Car-power mean is watts.
# Unknown Controller mean → 0 W (do not keep last sample).
# Do not abs leftover; a negative value is a deficit.
#
# go-e MQTT / HACS entity names vary. Each charger template tries psm,
# then phase_switch_mode; nrg JSON array index 11, else a power sensor.

template:
  - sensor:
      - name: go-e leftover kW
        unique_id: kotiakku_goe_direct_leftover_kw
        default_entity_id: sensor.kotiakku_goe_direct_leftover_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: "{{ states('sensor.solar_power') | is_number and states('sensor.house_power') | is_number }}"
        state: >-
          {% set solar = states('sensor.solar_power') | float(0) | abs %}
          {% set house = states('sensor.house_power') | float(0) | abs %}
          {% set ev_s = states('sensor.go_econtroller_ev_power_5_min_mean') %}
          {% set ev_kw = (ev_s | float(0) | abs / 1000) if ev_s | is_number else 0 %}
          {{ (solar - house + ev_kw) | round(3) }}
        attributes:
          solar_kw: "{{ states('sensor.solar_power') | float(0) | abs | round(3) }}"
          house_kw: "{{ states('sensor.house_power') | float(0) | abs | round(3) }}"
          ev_w: >-
            {% set ev_s = states('sensor.go_econtroller_ev_power_5_min_mean') %}
            {{ (ev_s | float(0) | abs | int) if ev_s | is_number else 0 }}

      - name: go-e charger 1 phases
        unique_id: kotiakku_goe_direct_111111_phases
        default_entity_id: sensor.kotiakku_goe_direct_111111_phases
        unit_of_measurement: " "
        state_class: measurement
        icon: mdi:sine-wave
        state: >-
          {% set ns = namespace(v='') %}
          {% for e in ['select.go_echarger_111111_psm', 'select.go_echarger_111111_phase_switch_mode', 'sensor.go_echarger_111111_psm'] %}
            {% if ns.v == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.v = states(e) %}
            {% endif %}
          {% endfor %}
          {% set p = ns.v | lower %}
          {% if p in ['force 3-phase', 'force_3', 'force3', '2', '3'] %}3
          {% elif p in ['force 1-phase', 'force_1', 'force1', '1'] %}1
          {% else %}0{% endif %}
        attributes:
          psm: >-
            {% set ns = namespace(v='') %}
            {% for e in ['select.go_echarger_111111_psm', 'select.go_echarger_111111_phase_switch_mode', 'sensor.go_echarger_111111_psm'] %}
              {% if ns.v == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.v = states(e) %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}

      - name: go-e charger 2 phases
        unique_id: kotiakku_goe_direct_222222_phases
        default_entity_id: sensor.kotiakku_goe_direct_222222_phases
        unit_of_measurement: " "
        state_class: measurement
        icon: mdi:sine-wave
        state: >-
          {% set ns = namespace(v='') %}
          {% for e in ['select.go_echarger_222222_psm', 'select.go_echarger_222222_phase_switch_mode', 'sensor.go_echarger_222222_psm'] %}
            {% if ns.v == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.v = states(e) %}
            {% endif %}
          {% endfor %}
          {% set p = ns.v | lower %}
          {% if p in ['force 3-phase', 'force_3', 'force3', '2', '3'] %}3
          {% elif p in ['force 1-phase', 'force_1', 'force1', '1'] %}1
          {% else %}0{% endif %}
        attributes:
          psm: >-
            {% set ns = namespace(v='') %}
            {% for e in ['select.go_echarger_222222_psm', 'select.go_echarger_222222_phase_switch_mode', 'sensor.go_echarger_222222_psm'] %}
              {% if ns.v == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.v = states(e) %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}

      - name: go-e charger 1 session amp
        unique_id: kotiakku_goe_direct_111111_session_amp
        default_entity_id: sensor.kotiakku_goe_direct_111111_session_amp
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        state: >-
          {% set phases = states('sensor.kotiakku_goe_direct_111111_phases') | int(0) %}
          {% set amp = states('number.go_echarger_111111_amp') | int(0) %}
          {{ amp if phases in [1, 3] and amp >= 6 else 0 }}

      - name: go-e charger 2 session amp
        unique_id: kotiakku_goe_direct_222222_session_amp
        default_entity_id: sensor.kotiakku_goe_direct_222222_session_amp
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        state: >-
          {% set phases = states('sensor.kotiakku_goe_direct_222222_phases') | int(0) %}
          {% set amp = states('number.go_echarger_222222_amp') | int(0) %}
          {{ amp if phases in [1, 3] and amp >= 6 else 0 }}

      - name: go-e charger 1 commanded kW
        unique_id: kotiakku_goe_direct_111111_commanded_kw
        default_entity_id: sensor.kotiakku_goe_direct_111111_commanded_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:ev-station
        state: >-
          {% set amp = states('sensor.kotiakku_goe_direct_111111_session_amp') | int(0) %}
          {% set phases = states('sensor.kotiakku_goe_direct_111111_phases') | int(0) %}
          {{ (amp * 230 * phases / 1000) | round(3) }}

      - name: go-e charger 2 commanded kW
        unique_id: kotiakku_goe_direct_222222_commanded_kw
        default_entity_id: sensor.kotiakku_goe_direct_222222_commanded_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:ev-station
        state: >-
          {% set amp = states('sensor.kotiakku_goe_direct_222222_session_amp') | int(0) %}
          {% set phases = states('sensor.kotiakku_goe_direct_222222_phases') | int(0) %}
          {{ (amp * 230 * phases / 1000) | round(3) }}

      - name: go-e charger 1 charge kW
        unique_id: kotiakku_goe_direct_111111_charge_kw
        default_entity_id: sensor.kotiakku_goe_direct_111111_charge_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt
        state: >-
          {% set ns = namespace(raw='') %}
          {% for e in ['sensor.go_echarger_111111_nrg', 'sensor.go_echarger_111111_power', 'sensor.go_echarger_111111_p_all', 'sensor.go_echarger_111111_charging_power'] %}
            {% if ns.raw == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.raw = states(e) %}
            {% endif %}
          {% endfor %}
          {% set raw = ns.raw %}
          {% if raw[:1] in ['[', '{'] %}
            {% set data = raw | from_json %}
            {% set nrg = data.nrg if data is mapping else data %}
            {{ ((nrg[11] | float(0) | abs / 1000) if nrg is sequence and nrg | length > 11 else 0) | round(3) }}
          {% elif ',' in raw %}
            {% set parts = raw.split(',') %}
            {{ ((parts[11] | float(0) | abs / 1000) if parts | length > 11 else 0) | round(3) }}
          {% else %}
            {% set v = raw | float(0) | abs %}
            {{ (v / 1000 if v > 50 else v) | round(3) }}
          {% endif %}

      - name: go-e charger 2 charge kW
        unique_id: kotiakku_goe_direct_222222_charge_kw
        default_entity_id: sensor.kotiakku_goe_direct_222222_charge_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt
        state: >-
          {% set ns = namespace(raw='') %}
          {% for e in ['sensor.go_echarger_222222_nrg', 'sensor.go_echarger_222222_power', 'sensor.go_echarger_222222_p_all', 'sensor.go_echarger_222222_charging_power'] %}
            {% if ns.raw == '' and states(e) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.raw = states(e) %}
            {% endif %}
          {% endfor %}
          {% set raw = ns.raw %}
          {% if raw[:1] in ['[', '{'] %}
            {% set data = raw | from_json %}
            {% set nrg = data.nrg if data is mapping else data %}
            {{ ((nrg[11] | float(0) | abs / 1000) if nrg is sequence and nrg | length > 11 else 0) | round(3) }}
          {% elif ',' in raw %}
            {% set parts = raw.split(',') %}
            {{ ((parts[11] | float(0) | abs / 1000) if parts | length > 11 else 0) | round(3) }}
          {% else %}
            {% set v = raw | float(0) | abs %}
            {{ (v / 1000 if v > 50 else v) | round(3) }}
          {% endif %}
